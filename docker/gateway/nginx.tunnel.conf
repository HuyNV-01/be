# ============================================================================
# NGINX UNIFIED GATEWAY CHO NGROK / CLOUDFLARE TUNNEL / REVERSE PROXY
# Gom cả Frontend (3003), Backend REST API + Webhook (3000) và Socket.IO (3000)
# vào chung 1 cổng (8080) để chỉ cần 1 Ngrok Domain duy nhất là đưa toàn bộ
# dự án (cả Web UI lẫn API & Webhook) lên Internet!
# ============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 100M;

    # Luôn gắn header bỏ qua trang cảnh báo Ngrok
    add_header ngrok-skip-browser-warning "true" always;

    # 1. Định tuyến REST API & Omnichannel Webhooks (/api/*) vào Backend (3000)
    location /api/ {
        proxy_pass http://host.docker.internal:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header ngrok-skip-browser-warning "true";
    }

    # 2. Định tuyến đường dẫn Webhook rút gọn (/webhooks/omnichannel/*) vào Backend (3000)
    location /webhooks/omnichannel/ {
        proxy_pass http://host.docker.internal:3000/api/webhooks/omnichannel/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header ngrok-skip-browser-warning "true";
    }

    # 3. Định tuyến kết nối thời gian thực Socket.IO (/socket.io/*) vào Backend (3000)
    location /socket.io/ {
        proxy_pass http://host.docker.internal:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Định tuyến toàn bộ giao diện người dùng (/*) vào Next.js Frontend (3003)
    location / {
        proxy_pass http://host.docker.internal:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
