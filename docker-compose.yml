version: '3.8'

networks:
  app-network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-be}_network

services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs_storage
    restart: unless-stopped
    ports:
      - '${STORAGE_API_PORT:-8333}:8333'
      - '${STORAGE_CONSOLE_PORT:-8888}:8888'
      - '9333:9333'
    volumes:
      - ./storage_data/seaweedfs:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    command: >
      server
      -dir=/data
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -s3.allowEmptyFolder=true
      -filer
      -filer.port=8888
      -volume.max=100
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:9333/cluster/status || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: redis-server
    restart: always
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-123456}
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-123456}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: always
    ports:
      - '5540:5540'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

volumes:
  redis_data:
    driver: local
