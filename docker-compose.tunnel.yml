version: '3.8'

# ============================================================================
# DOCKER COMPOSE TÁCH BIỆT CHO CỔNG KẾT NỐI INTERNET (NGROK / CLOUDFLARE TUNNEL)
# ----------------------------------------------------------------------------
# Kịch bản 1: Mở Ngrok cho Backend (hoặc qua Nginx Unified Gateway cho cả FE + BE):
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml --profile ngrok up -d
# Kịch bản 2: Thay thế Ngrok bằng Cloudflare Tunnel (Zero-code change):
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml --profile cloudflare up -d
# ============================================================================

services:
  unified-gateway:
    image: nginx:alpine
    container_name: pancake_unified_gateway
    restart: unless-stopped
    profiles:
      - ngrok
      - cloudflare
      - gateway
    ports:
      - '${GATEWAY_PORT:-8080}:8080'
    volumes:
      - ./docker/gateway/nginx.tunnel.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - app-network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: pancake_ngrok_tunnel
    restart: unless-stopped
    profiles:
      - ngrok
    depends_on:
      - unified-gateway
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    command:
      - 'http'
      - '${TUNNEL_UPSTREAM_TARGET:-unified-gateway:8080}'
      - '--url=${NGROK_DOMAIN:-}'
      - '--log=stdout'
    ports:
      - '4040:4040'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pancake_cloudflare_tunnel
    restart: unless-stopped
    profiles:
      - cloudflare
    depends_on:
      - unified-gateway
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - app-network
